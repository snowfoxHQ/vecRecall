name: Publish to PyPI

# 推送 v* 标签时自动构建并发布到 PyPI。
# 使用 PyPI Trusted Publishing（OIDC），仓库里不存任何 API token。
# 首次使用前需要在 PyPI 项目设置里添加 Trusted Publisher（见 RELEASING.md）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 防止标签和包版本不一致（例如打了 v2.3.0 却忘了改 pyproject.toml）
      - name: Tag must match package version
        shell: python
        run: |
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__\s*=\s*"([^"]+)"',
                           open("vecrecall/__init__.py", encoding="utf-8").read()).group(1)
          print(f"tag={tag} pyproject={ver} __init__={init}")
          sys.exit(0 if tag == ver == init else 1)

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/vecrecall/
    permissions:
      id-token: write   # Trusted Publishing 必需
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
